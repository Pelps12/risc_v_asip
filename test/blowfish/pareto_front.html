const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const PAD = {top:30, right:30, bottom:58, left:86};
const W = canvas.width - PAD.left - PAD.right;
const H = canvas.height - PAD.top - PAD.bottom;
let drawn = [];
function opts() { return { logX: document.getElementById("logX").checked, logY: document.getElementById("logY").checked, showPareto: document.getElementById("showPareto").checked, showAll: document.getElementById("showAll").checked, filter: document.getElementById("filterCat").value }; }
function shown(o) { return POINTS.filter(p => o.showAll && (o.filter === "all" || p.category === o.filter)); }
function tx(v, min, max, log) { if (log) { const a = Math.log10(min), b = Math.log10(max); return (Math.log10(v) - a) / (b - a); } return (v - min) / (max - min); }
function fmt(v) { return Number(v).toLocaleString(); }
function niceTicks(min, max, log) { if (log) { const out = []; for (let p = Math.floor(Math.log10(min)); p <= Math.ceil(Math.log10(max)); p++) { for (const m of [1,2,5]) { const v = m * Math.pow(10,p); if (v >= min && v <= max) out.push(v); } } return out; } const out = [], n = 6, step = (max - min) / n; for (let i=0; i<=n; i++) out.push(min + i*step); return out; }

}
canvas.addEventListener("mousemove", e => { const rect = canvas.getBoundingClientRect(); const mx = e.clientX - rect.left, my = e.clientY - rect.top; let hit = null; for (const d of drawn) { if ((d.x-mx)**2 + (d.y-my)**2 <= d.r**2) hit = d.p; } if (hit) { tooltip.style.display = "block"; tooltip.style.left = `${e.pageX + 12}px`; tooltip.style.top = `${e.pageY + 12}px`; tooltip.innerHTML = `<b>${hit.variant}</b><br>Category: ${hit.category}<br>Cycles: ${fmt(hit.cycles)}<br>Area: ${fmt(hit.area)}<br>Speedup: ${hit.speedup}x<br>Area overhead: ${hit.area_pct}%<br>CPI: ${hit.cpi}<br>No-CI CPI: ${hit.cpi_no_ci}<br>No-CI overhead: ${hit.no_ci_overhead}`; } else tooltip.style.display = "none"; });
